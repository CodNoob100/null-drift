name: Docker Gateway Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "scripts/docker_smoke.sh"
      - "scripts/check_gateway_health.py"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Black and print exact formatting patch
        run: |
          python -m pip install black
          black --version
          black --diff scripts/check_gateway_health.py tests/test_gateway_health.py
          black --check scripts/check_gateway_health.py tests/test_gateway_health.py

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate and exercise Docker Compose gateway
        run: bash scripts/docker_smoke.sh
