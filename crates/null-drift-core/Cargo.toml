[package]
name = "null-drift-core"
version = "0.3.0"
edition = "2024"

[dependencies]
ndarray = { version = "0.17.2", features = ["serde"] }
rand = "0.10"
rand_distr = "0.6"
rand_pcg = "0.10"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
rand09 = { package = "rand", version = "0.9" }
rand_distr05 = { package = "rand_distr", version = "0.5" }
rand_pcg09 = { package = "rand_pcg", version = "0.9" }
