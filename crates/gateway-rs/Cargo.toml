[package]
name = "gateway-rs"
version = "0.3.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.36.0", features = ["full"] }
fastembed = "7.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "query"] }
anyhow = "1.0"
